name: Bug 报告
description: 报告可以复现的错误或异常行为
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 API Key、私人数据或客户信息。请优先使用 iris 或构造的最小示例。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 点击……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Console 错误信息
      render: text
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、R 版本和 RBench 提交或版本。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容中不包含 API Key、私人数据或个人信息。
          required: true
